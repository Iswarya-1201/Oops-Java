<html>
    <head>
        <style>
            span.first{
                display: inline;
                color: lightcoral;
                border:20px solid blue;
                padding: 10px;
                
            }
            span.secound{
                display:inline-block;
                color: blue;
                border: 10px solid yellow;
                width: 30px;
                height: 50px;
                
                padding: 20px;
            }
            span.third{
                display: block;
                color:brown;
                border:10px solid green;
            }
        </style>
    </head>
    <body>
        <div>
            <h1>inline</h1><br>
    <span class="first">java</span>
    <span class="first">Python</span>
        </div><br>
        <div>
            <h1>inline block</h1><br></br>
    <span class="secound">java</span>
    <span class="secound">Python</span>
        </div>
        <div><br>
            <h1>block</h1>
    <span class="third">java</span>
    <span class="third">Python</span>
        </div>
    </body>
</html>
